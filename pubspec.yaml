name: pos_app_ui
description: "Multi-terminal POS terminal app (Flutter) for the POS SaaS backend."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  bloc: ^9.2.1
  flutter_bloc: ^9.1.1

  # Models and code generation annotations
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0

  # Dependency injection
  get_it: ^9.3.0

  # Networking, security, storage
  dio: ^5.11.1
  crypto: ^3.0.8
  flutter_secure_storage: ^11.2.0
  uuid: ^4.6.0

  # Navigation
  go_router: ^18.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Code generation: dart run build_runner build --delete-conflicting-outputs
  build_runner: ^2.16.1  # 2.16.2+ needs analyzer 14, which flutter_test does not allow yet
  freezed: ^4.0.1
  json_serializable: ^6.15.2

  # Tests
  bloc_test: ^10.0.0
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
